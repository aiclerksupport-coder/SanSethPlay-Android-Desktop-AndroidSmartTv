name: sanseth_play
description: SanSeth Play - responsive, cross-platform, lawful IPTV and M3U media player.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  smtc_windows: ^1.1.0
  share_plus: ^13.3.1
  http: ^1.6.0
  crypto: ^3.0.6
  xml: ^6.5.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^11.2.0
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.7
  path_provider: ^2.1.5
  path: ^1.9.1
  cryptography: ^2.9.0
  package_info_plus: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/branding/
